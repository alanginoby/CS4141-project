<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="flights.css">
    <title>Book Flights</title>
</head>
<body>
    <div class="header">
        <button class="home-btn">HOME</button>
        <button class="euro-btn">DESTINATIONS</button>
        <button class="flight-btn">FLIGHTS</button>
        <button class="about-btn">ABOUT US</button>
    </div>
<div class="tickets-container">

</div>
    <div class="map">
        <p class="help">We will help you to: </p>
        <button class="desti-btn">
            <ion-icon name="location-outline" class="desti"></ion-icon>
            Find Destinations
        </button>
        <button class="plane-btn">
            <ion-icon name="airplane-outline" class="planes"></ion-icon>
            Book Flights
        </button>
        <button class="case-btn">
            <ion-icon name="briefcase-outline" class="case"></ion-icon>
            Pack Your Packages
        </button>
        <button class="bed-btn">
            <ion-icon name="bed-outline" class="bed"></ion-icon>
            Book Hotels
        </button>
    </div>
</body>
<script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>
